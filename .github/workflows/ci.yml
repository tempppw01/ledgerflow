name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

# 连着推几次时,只跑最后一次 —— 否则每个提交都会起一个完整 run
# (2026-11-25 实测:连着推三个提交,页面上三个 run 同时在跑),
# 而且两个 docker 构建会同时往 :latest 推。
# 被顶掉的旧 run 取消掉即可:它的结论对新提交没有意义。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: 34v0wphix/ledgerflow

jobs:
  # 先验证代码,再打镜像。
  #
  # 之前这个工作流**只构建镜像**:Dockerfile 里的 `npm run build` 会跑 tsc,
  # 但**测试、lint、以及 scripts/ 下的几道闸门从来没在 CI 里跑过** ——
  # 那些闸门当时只是「本地约定」。把验证独立成一个 job 并让镜像依赖它之后,
  # 闸门失败会直接拦住镜像发布。
  verify:
    runs-on: ubuntu-latest
    # 没有超时的话,卡住的 job 会一直挂到 GitHub 的默认上限(6 小时)才结束。
    # 实测这几个步骤加起来不到十分钟,给它一个明确上限。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 服务端测试 import 了 node:sqlite(Node >= 22 才有),运行镜像也是 node:24。
          # 用 20 会让服务端 7 个测试文件全部 ERR_UNKNOWN_BUILTIN_MODULE。
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # 生产构建原本**只在 Docker 里跑**,而 Docker 的构建阶段用的是 node:20 ——
      # 也就是说除它之外全仓都是 Node 24,唯独生产构建只在 20 上被验证过。
      # 加这一步,让 vite build 也在 CI 的 Node 24 上跑一遍;之后再把 Dockerfile 的
      # 构建阶段对齐到 24,就是"先让验证存在,再依赖它"。
      - name: Production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Frontend tests
        run: npm test

      - name: Server tests
        run: node --test server/*.test.js

      - name: i18n gates
        run: |
          npm run i18n:check
          npm run i18n:check-jsx

      - name: Date usage gate
        run: npm run check:dates

      - name: Money format gate
        run: npm run check:money

      # 这几个也是纯静态检查(不依赖浏览器与数据库),没有理由只在本地跑:
      # 闸门一旦要靠「记得跑」,就等于没有。
      - name: Static consistency gates
        run: |
          npm run check:shared-predicates
          npm run check:docs
          npm run check:audit-routes
          npm run audit:sums
          npm run check:dynamic-i18n
          npm run check:orphan-methods
          npm run check:dead-exports
          # 注意:不要在这里加 check:jsx-hardcoded —— 它和上面 i18n gates 里的
          # i18n:check-jsx 是**同一条命令**(都是 audit-jsx-hardcoded.mjs --fail)。
          # 2026-11-25 我"把没接上的闸门接上"时加过一次,结果同一个脚本在 CI 里跑了两遍。
          npm run check:r2-fetch
          npm run check:gate-exceptions

  docker-latest:
    needs: verify
    runs-on: ubuntu-latest
    # 多架构构建比 verify 慢得多(实测十分钟上下),给它一个更宽松但仍然明确的上限。
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push latest image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
