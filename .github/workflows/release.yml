name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的版本标签，例如 v0.6.5'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          NOTES="release-notes/RELEASE_NOTES_${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          gh release create "$TAG" --title "LedgerFlow ${TAG}" --notes-file "$NOTES" --verify-tag
