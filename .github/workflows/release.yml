name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的版本标签,例如 v0.6.5'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # tag 名与仓库里的版本号必须一致。
          # 没有这一步的话,一个手误的 tag(比如 v0.50.56 打在 0.50.55 的提交上)会顺利地
          # 发出去:Release 标题写着这个版本,内容却是另一个版本的 —— 而且没有任何东西会拦。
          # 2026-11-25 加上:此前 release.yml 只负责发,不检查任何一致性。
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          APP_VERSION="$(node -e "const fs=require('fs');const m=fs.readFileSync('src/shared/config/app.ts','utf8').match(/export const APP_VERSION\\s*=\\s*'([^']+)'/);process.stdout.write(m?m[1]:'')")"

          echo "tag=${TAG} (${TAG_VERSION}) package.json=${PKG_VERSION} APP_VERSION=${APP_VERSION}"

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${TAG} 与 package.json 的版本 ${PKG_VERSION} 不一致 —— 要么 tag 打错了,要么发布前忘了改版本号"
            exit 1
          fi
          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::APP_VERSION(${APP_VERSION})与 package.json(${PKG_VERSION})不一致 —— 应用内显示的版本会是错的"
            exit 1
          fi

      - name: Resolve release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          NOTES="release-notes/RELEASE_NOTES_${TAG}.md"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

          if [ -f "$NOTES" ]; then
            echo "notes: 使用 tag 自带的 $NOTES"
            exit 0
          fi

          # 兼容历史:发布说明的约定在 v0.10.0 之后中断过,老 tag 的提交里没有这个文件。
          # 先尝试从默认分支取一份同名文件补上,这样补写历史版本的说明也能生效。
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch --depth=1 origin "$DEFAULT_BRANCH" || true
          if git show "origin/${DEFAULT_BRANCH}:${NOTES}" > "$NOTES" 2>/dev/null; then
            echo "notes: tag 里没有,已从默认分支 ${DEFAULT_BRANCH} 补齐"
            exit 0
          fi

          # 没有说明文件:
          #   - 该 tag 的 Release 已经存在(历史版本多由手工创建)→ 没有可发布的内容,跳过即可,
          #     不再把 CI 顶红。真正的约定靠下面的新 tag 路径保证。
          #   - Release 还不存在 → 这是新 tag 漏写说明,必须失败提醒。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::${NOTES} 不存在,但 ${TAG} 的 Release 已存在,跳过发布"
            echo "SKIP_PUBLISH=1" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Missing release notes: $NOTES" >&2
          echo "请在 release-notes/ 下补 ${NOTES} 后再打 tag(见 docs/release-process.md)" >&2
          exit 1

      - name: Publish GitHub Release
        if: env.SKIP_PUBLISH != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 已存在就更新说明,而不是报错退出 —— 补写历史说明、重跑工作流都用这条路径。
            gh release edit "$TAG" --title "LedgerFlow ${TAG}" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "LedgerFlow ${TAG}" --notes-file "$NOTES" --verify-tag
          fi
