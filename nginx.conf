map $http_x_forwarded_proto $ledgerflow_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 允许更大的备份上传体积，避免 WebDAV 上传时 413
  client_max_body_size 50m;

  # 字体走同源上暴露,再由 nginx 反代到对象存储。
  # @font-face 跨域必须带 Access-Control-Allow-Origin,而 pub-*.r2.dev 不返回该响应头,
  # 直接引用绝对地址会导致全站自定义字体被浏览器拒绝。
  # resolver + 变量式 proxy_pass:域名只在请求时解析,避免 nginx 启动阶段因 DNS 未就绪而退出。
  location /cdn/ {
    resolver 127.0.0.11 8.8.8.8 ipv6=off valid=300s;
    resolver_timeout 5s;
    set $ledgerflow_cdn_host pub-7c333d8dd649422b8c267f82f1a9b4c4.r2.dev;
    # 变量式 proxy_pass 不做 URI 替换,因此这里显式去掉 /cdn 前缀并保留查询串。
    # 注意不能直接用 $request_uri,否则会把 /cdn 一起带到上游变成 404。
    rewrite ^/cdn/(.*)$ /$1 break;
    set $ledgerflow_cdn_path $uri;
    proxy_pass https://$ledgerflow_cdn_host$ledgerflow_cdn_path$is_args$args;
    proxy_ssl_server_name on;
    proxy_set_header Host $ledgerflow_cdn_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ledgerflow_forwarded_proto;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    # 字体内容不变,缓存到客户端,减少回源。
    expires 30d;
    add_header Cache-Control "public";
  }

  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ledgerflow_forwarded_proto;
    proxy_pass http://127.0.0.1:8787;
  }

  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
